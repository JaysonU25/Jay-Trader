name = "market-pulse-cron"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# API_BASE_URL is public (it is just an origin) so it lives here. The HMAC
# secret does not: set it with
#   npx wrangler secret put INGEST_HMAC_SECRET
# and it must match the API's INGEST_HMAC_SECRET exactly.
[vars]
API_BASE_URL = "https://market-pulse-nurd5q.fly.dev"

# Every expression must be unique: Cloudflare passes the matched expression as
# event.cron, and that string is the only way the handler tells triggers apart.
# Spec 5.2 gives crypto and news the same "0 */6 * * *", which would make one of
# them unroutable, so news is offset by ten minutes.
[triggers]
crons = [
  "15 13 * * *",   # macro    - after the 08:30 ET FRED releases
  "30 15 * * 1-5", # fx       - after the ECB publishes, ~15:00 UTC
  "0 22 * * 1-5",  # prices   - after the US close, 21:00 UTC
  "0 */6 * * *",   # crypto
  "10 */6 * * *",  # news
  "0 23 * * *",    # earnings
  "0 4 * * 1",     # ratings  - weekly
]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

